apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: scip-sync
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Knowledge Base
    tekton.dev/tags: archon, scip, sync, knowledge-base
    tekton.dev/displayName: "SCIP Sync Pipeline"
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Clones workspace repositories, runs SCIP indexing, syncs the code graph,
    and generates natural-language summaries for the vector store.

  params:
    - name: kb-name
      description: Name of the KnowledgeBase resource
      type: string
    - name: kb-namespace
      description: Namespace of the KnowledgeBase resource
      type: string
    - name: workspace-name
      description: Logical workspace name for the knowledge base
      type: string
    - name: auth-credential-secret
      description: Name of the Secret property containing auth credentials JSON (empty to skip summary generation)
      type: string
      default: ""
    - name: agent-model
      description: Model identifier for summary generation (empty for agent default)
      type: string
      default: ""

  workspaces:
    - name: shared-data
      description: Shared workspace volume for cloned repos and generated artifacts

  steps:
    # ------------------------------------------------------------------
    # Step 1: Clone repositories listed in the KB repos ConfigMap
    # ------------------------------------------------------------------
    - name: clone-repos
      image: "ghcr.io/bdchatham/aphex-scip-runner:latest"
      script: |
        #!/bin/bash
        set -euo pipefail

        REPOS_DIR="$(workspaces.shared-data.path)/repos"
        mkdir -p "${REPOS_DIR}"

        CM_JSON=$(kubectl get configmap "$(params.kb-name)-repos" \
          -n "$(params.kb-namespace)" -o json)

        INDICES=$(echo "${CM_JSON}" | jq -r '.data | keys[] | select(endswith(".repoName"))' | sed 's/.repoName$//')

        FAILED=0
        for IDX in ${INDICES}; do
          ORG=$(echo "${CM_JSON}" | jq -r --arg k "${IDX}.repoOrg" '.data[$k]')
          NAME=$(echo "${CM_JSON}" | jq -r --arg k "${IDX}.repoName" '.data[$k]')
          BRANCH=$(echo "${CM_JSON}" | jq -r --arg k "${IDX}.branch" '.data[$k] // "mainline"')
          URL="https://github.com/${ORG}/${NAME}.git"

          echo "Cloning ${URL} (branch: ${BRANCH})"
          if git clone --depth 1 --branch "${BRANCH}" "${URL}" "${REPOS_DIR}/${NAME}"; then
            echo "  ✓ ${NAME}"
          else
            echo "  ✗ ${NAME}"
            FAILED=1
          fi
        done

        [ "${FAILED}" -eq 0 ] || { echo "Some clones failed"; exit 1; }

    # ------------------------------------------------------------------
    # Step 2: SCIP index all packages in the workspace
    # ------------------------------------------------------------------
    - name: scip-index
      image: "ghcr.io/bdchatham/aphex-scip-runner:latest"
      script: |
        #!/bin/bash
        set -euo pipefail
        aphex-kb index --workspace "$(workspaces.shared-data.path)/repos"

    # ------------------------------------------------------------------
    # Step 3: Sync SCIP data to the Code Graph and Vector Store
    # ------------------------------------------------------------------
    - name: sync-graph
      image: "ghcr.io/bdchatham/aphex-scip-runner:latest"
      env:
        - name: GRAPH_URL
          value: "http://$(params.kb-name)-graph:8081"
        - name: QDRANT_URL
          value: "http://$(params.kb-name)-qdrant:6334"
        - name: EMBEDDING_URL
          value: "http://$(params.kb-name)-embedding-svc:8000"
      script: |
        #!/bin/bash
        set -euo pipefail
        aphex-kb sync --workspace "$(workspaces.shared-data.path)/repos"

    # ------------------------------------------------------------------
    # Step 4: Generate natural-language summaries via Kiro + MCP tools
    #         Skipped when no auth credential secret is provided.
    # ------------------------------------------------------------------
    - name: generate-summaries
      image: "ghcr.io/bdchatham/aphex-scip-runner:latest"
      env:
        - name: GRAPH_URL
          value: "http://$(params.kb-name)-graph:8081"
        - name: QDRANT_URL
          value: "http://$(params.kb-name)-qdrant:6334"
        - name: EMBEDDING_URL
          value: "http://$(params.kb-name)-embedding-svc:8000"
        - name: AUTH_CREDENTIAL_SECRET
          value: "$(params.auth-credential-secret)"
        - name: AGENT_MODEL
          value: "$(params.agent-model)"
      script: |
        #!/bin/bash
        set -euo pipefail

        if [ -z "${AUTH_CREDENTIAL_SECRET}" ]; then
          echo "No auth credentials configured — skipping summary generation"
          exit 0
        fi

        CREDS_JSON=$(kubectl get secret "$(params.kb-name)-secrets" \
          -n "$(params.kb-namespace)" \
          -o jsonpath='{.data.auth_credentials}' | base64 -d)

        SOCIAL_TOKEN=$(echo "${CREDS_JSON}" | jq -r '.social_token')
        PROFILE=$(echo "${CREDS_JSON}" | jq -r '.profile')

        KIRO_DATA="${HOME}/.local/share/kiro-cli"
        mkdir -p "${KIRO_DATA}"

        # Create auth_kv and inject token; kiro-cli creates state table itself
        sqlite3 "${KIRO_DATA}/data.sqlite3" \
          "CREATE TABLE IF NOT EXISTS auth_kv (key TEXT PRIMARY KEY, value TEXT);" \
          "INSERT OR REPLACE INTO auth_kv (key, value) VALUES ('kirocli:social:token', json('${SOCIAL_TOKEN}'));"

        WORKSPACE="$(workspaces.shared-data.path)/repos"

        MODEL_FLAG=""
        if [ -n "${AGENT_MODEL}" ]; then
          MODEL_FLAG="Use model: ${AGENT_MODEL}."
        fi

        kiro-cli chat --no-interactive --trust-all-tools \
          "You have access to the aphex-knowledge-base MCP tools.

        The workspace at ${WORKSPACE} has been SCIP-indexed and synced to the
        Code Graph. Your job is to generate natural-language summaries of the
        component relationships in this workspace.

        For each package in the workspace:
        1. Use the MCP tools to read the SCIP indexes and discover symbols
        2. Identify key components, their responsibilities, and how they relate
        3. Write a concise summary (400-800 tokens) that explains the package's
           architecture, key abstractions, and cross-package dependencies
        4. Embed ARN references (arn:archon:code:...) for every symbol you mention
           so other agents can look them up in the Code Graph
        5. Sync each summary to the Vector Store using the sync_to_knowledge_base tool

        Workspace name: $(params.workspace-name)
        Workspace path: ${WORKSPACE}
        ${MODEL_FLAG}"
